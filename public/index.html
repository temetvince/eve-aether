<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="darkreader-lock" />
    <meta
      name="theme-color"
      content="#04161a"

    />
    <base href="<%= BASE_HREF %>" />
    <!-- Dynamic from webpack -->
    <title>Aether Fleet Ops</title>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
